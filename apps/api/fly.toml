# Fly.io deployment for the API. See docs/deployment.md.
# Rename `app` to something globally unique before `fly launch --copy-config`.
app = "acme-salary-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  ACME_ENVIRONMENT = "production"
  ACME_DATABASE_URL = "sqlite:////data/acme.db"
  # Set with: fly secrets set ACME_JWT_SECRET=... ACME_DEMO_PASSWORD=...
  # Set the frontend origin with: fly secrets set ACME_CORS_ORIGINS='["https://<web>.vercel.app"]'

# SQLite lives on a persistent volume (ADR 005). One machine, one writer.
[mounts]
  source = "acme_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1  # keep one warm so reviewers never wait for a cold start

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
